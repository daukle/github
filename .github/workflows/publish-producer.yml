name: Publish the producer manifest

# The producer manifest the fetches-a-real-release-asset case FETCHES, published
# from the repository whose test reads it.
#
# `gh release upload` names an asset by its basename, so this publishes as
# `daukle.toml` and the source plugin's default asset name still resolves.
on:
  push:
    tags:
      - 'greeter-*'

permissions:
  contents: write

jobs:
  publish:
    uses: intisy/workflows/.github/workflows/publish.yml@main
    with:
      targets: none
      toolchains: none
      release_assets: 'test/producer/daukle.toml'
      release_notes_from_commit: true
    secrets:
      envPAT: ${{ secrets.PAT }}
