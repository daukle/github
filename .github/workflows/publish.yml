name: Publish

# A tag push is the whole release mechanism, and this repository publishes two
# unrelated things: the plugin, tagged with its own version, and the producer
# manifest its example fetches, tagged `greeter-*` by publish-producer.yml. An
# unrestricted `*` here would have published plugin.lua under the producer's tag,
# at a URL that cannot be withdrawn.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish:
    uses: intisy/workflows/.github/workflows/publish.yml@main
    with:
      # Nothing here is an npm package, a jar or a gradle plugin, so detection is
      # turned off rather than left to find nothing: a silent empty detection and a
      # deliberate "publish only the asset" look the same in a log.
      targets: none
      toolchains: none
      release_assets: 'plugin.lua'
      release_notes_from_commit: true
    secrets:
      envPAT: ${{ secrets.PAT }}
